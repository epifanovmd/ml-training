# Значения по умолчанию для любого проекта. project.yaml переопределяет
# только то, что действительно отличается. Ядро не знает предметной области,
# поэтому здесь нет ни классов, ни путей к конкретным данным.

classes: []

dataset:
  sources: []                # каталоги в YOLO-формате; пусто -> все из datasets/<проект>/
  val_ratio: 0.15
  test_ratio: 0.0            # >0 — отдельный сплит для честной финальной оценки
  # Единица сплита. Кадры одной группы никогда не расходятся по разным сплитам:
  #   stem     — группа = кадр (годится, только если дубликатов заведомо нет)
  #   roboflow — копии-аугментации одного снимка (имена «….rf.<хэш>»)
  #   parent   — все кадры из одного подкаталога (серия, объект, сессия)
  #   regex:<шаблон> — группа = первая скобка шаблона в имени файла
  group_by: stem
  # Держать известные группы в их сплитах при пополнении данных. Без этого
  # добор кадров перетасовывает train/val: метрики прогонов несравнимы, а
  # дообучение с прошлых весов даёт утечку. Раскладка хранится в
  # workspace/<проект>/splits.json, полный пересчёт — mlkit dataset --reset-splits
  stable_splits: true
  keep_classes: null         # [0, 2] — какие классы исходной разметки оставить
  # Соответствие «класс источника -> класс проекта». Ключи и значения —
  # номера или имена (имена источника читаются из его data.yaml):
  #   class_map: {0: 0, 2: 1}
  #   class_map: {code: container_code, seal: seal_number}
  #   class_map: {default: {...}, roboflow-a: {...}}   # своя карта на источник
  # Классы, которых нет в карте, в датасет не попадают.
  class_map: null
  # Сводить ли все классы источников в один (задача «найти регион»).
  # auto — да при одном классе в classes, нет при нескольких.
  collapse_classes: auto
  copy: true                 # false — жёсткие ссылки вместо копий (экономит диск)
  # Кадры без объектов («фон»). Немного фона снижает ложные срабатывания,
  # избыток — учит модель молчать. Ориентир 1–10% (в COCO ~1%).
  negatives:
    max_share: null          # 0.1 — оставить не больше 10% фоновых кадров;
                             # null — брать все, что есть в источниках

model:
  base: yolo11n.pt
  imgsz: 640

train:
  # --- бюджет обучения ---------------------------------------------------
  epochs: 100
  time: null                 # часов; лимит по времени вместо числа эпох
  patience: 30               # ранняя остановка: эпох без улучшения mAP
  batch: 16                  # auto — подбор по видеопамяти (только CUDA)
  workers: auto              # auto — половина ядер, но не больше 8
  device: auto               # auto | mps | cpu | 0
  seed: 42
  deterministic: true        # воспроизводимость важнее пары процентов скорости

  # --- оптимизация -------------------------------------------------------
  optimizer: auto            # auto | SGD | AdamW (auto решает по размеру датасета)
  lr0: 0.01                  # для AdamW уменьшают примерно в 10 раз
  lrf: 0.01                  # финальный lr = lr0 * lrf
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0         # плавный разгон: без него первые шаги рвут веса
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true               # косинусный спад — мягче ступенчатого
  nbs: 64                    # номинальный батч: градиенты копятся до него,
                             # поэтому маленький batch не меняет силу шага

  # --- веса функции потерь ----------------------------------------------
  box: 7.5                   # больше — точнее рамка, важно для OCR-региона
  cls: 0.5                   # при одном классе роли почти не играет
  dfl: 1.5

  # --- регуляризация и режимы -------------------------------------------
  dropout: 0.0
  freeze: null               # 10 — заморозить backbone при дообучении на малых данных
  multi_scale: 0.0           # 0.2–0.5 — обучение на разных масштабах (мелкие объекты)
  rect: false                # true экономит время, но ломает мозаику
  single_cls: false
  amp: true                  # смешанная точность; на mps ultralytics сам отключит
  fraction: 1.0              # <1 — учиться на части данных (быстрые пробы)
  cache: false               # ram | disk — быстрее эпохи ценой памяти
  pretrained: true

  # --- вывод -------------------------------------------------------------
  val: true
  plots: true
  save_period: -1            # >0 — сохранять чекпойнт каждые N эпох

augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  erasing: 0.4

# Профили — готовые наборы настроек поверх основных секций.
# Переключение: make train P=… PROFILE=quality
profiles:
  fast:                      # проверить, что данные и пайплайн живые
    train:
      epochs: 15
      patience: 5
      cache: ram
      plots: false
    augment:
      mosaic: 0.5
      mixup: 0.0
      erasing: 0.2

  quality:                   # выжать максимум из имеющихся данных
    model:
      imgsz: 960             # мелкий текст выигрывает от разрешения сильнее всего
    train:
      epochs: 300
      patience: 60
      optimizer: AdamW
      lr0: 0.001
      lrf: 0.01
      warmup_epochs: 5.0
      cos_lr: true
      multi_scale: 0.25      # устойчивость к разной дистанции съёмки
      close_mosaic: 25       # последние эпохи — на «честных» кадрах
      nbs: 64
    augment:
      mosaic: 0.9
      mixup: 0.1
      scale: 0.7
      erasing: 0.35

  finetune:                  # дообучение поверх своих весов на пополнении данных
    train:
      epochs: 40
      lr0: 0.002
      warmup_epochs: 1.0
      freeze: 10             # backbone не трогаем: данных мало
      patience: 15
    augment:
      mosaic: 0.4
      mixup: 0.0

predict:
  conf: 0.25
  device: null

export:
  model_name: model
  formats: [coreml, tflite]
  coreml_nms: false
  tflite_int8: false
  half: true
