# Значения по умолчанию для любого проекта. project.yaml переопределяет
# только то, что действительно отличается. Ядро не знает предметной области,
# поэтому здесь нет ни классов, ни путей к конкретным данным.

classes: []

dataset:
  sources: []                # каталоги в YOLO-формате; пусто -> все из datasets/<проект>/
  val_ratio: 0.15
  keep_classes: null         # [0, 2] — какие классы исходной разметки оставить
  copy: true                 # false — жёсткие ссылки вместо копий (экономит диск)

model:
  base: yolo11n.pt
  imgsz: 640

train:
  epochs: 100
  batch: 16
  patience: 30
  optimizer: auto
  lr0: 0.01
  cos_lr: true
  device: mps
  workers: 8
  seed: 42

augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  mixup: 0.0
  erasing: 0.4

predict:
  conf: 0.25
  device: null

export:
  model_name: model
  formats: [coreml, tflite]
  coreml_nms: false
  tflite_int8: false
  half: true
