# Детектор регионов маркировки морского контейнера: код ISO 6346,
# типоразмер и весовая табличка.
# Потребитель модели — мобильное приложение (features/container-scan):
# детектор находит регионы, текст читают Apple Vision / ML Kit.
#
# Размеченные данные берутся из datasets/container-code/ (любое число
# подкаталогов в YOLO-формате).
#
# Всё, чего нет в этом файле, берётся из значений по умолчанию ядра
# (src/mlkit/defaults.yaml).

description: "Маркировка морского контейнера: код, типоразмер, весовая табличка"

# Порядок = индексы классов в модели: их же разбирает приложение, поэтому
# менять порядок и вставлять классы в середину нельзя — уже выложенный
# .mlpackage/.tflite перестанет совпадать с ожиданиями потребителя.
# Совпадает с разметкой из ml-datasets (projects/container-code/project.yaml).
classes:
  - container_code             # ISO 6346: четыре буквы, шесть цифр и контрольная
  - container_type             # типоразмер рядом с кодом: 45G1, 22G1
  - container_weight           # блок MAX GROSS / TARE / NET

# --- 1. датасет ------------------------------------------------------------
dataset:
  # Пусто = все подкаталоги datasets/container-code/
  sources: []
  # Классы источника (classes.txt из ml-datasets) совпадают с classes проекта
  # один в один, поэтому ни class_map, ни keep_classes не нужны. Схлопывать
  # нельзя: типоразмер и весовая табличка — не код, и детектор, обученный
  # звать их кодом, отдаст приложению чужой текст на распознавание.
  collapse_classes: false
  val_ratio: 0.15
  test_ratio: 0.15             # отложенный сплит для честной финальной оценки
  # Кадры одного контейнера — одна группа: несколько ракурсов одного объекта
  # в train и val завышают метрики. Код контейнера есть в имени файла.
  group_by: 'regex:([A-Z]{4}[0-9]{7})'
  negatives:
    # Фото техосмотров чаще всего без кода в кадре, поэтому авторазметка
    # даёт много фона. Когда наберётся достаточно кадров с кодом, ограничить
    # долю фона: max_share: 0.15 (ориентир 1–10%, но негативы здесь ценны —
    # ночь, блики, ржавчина, соседние контейнеры).
    max_share: null

# --- 2. обучение -----------------------------------------------------------
model:
  base: yolo11n.pt             # n — скорость на телефоне, s — точнее
  imgsz: 640                   # мелкий текст на борту: меньше 640 не берём

train:
  epochs: 150
  batch: 16
  patience: 30
  optimizer: auto
  lr0: 0.01
  cos_lr: true
  device: mps
  workers: 8
  seed: 42

# Ржавчина и грязь имитируются цветовыми сдвигами и стиранием, съёмка
# с рук — перспективой и сдвигами. Горизонтальный флип допустим:
# детектор ищет регион, читает текст OCR.
augment:
  hsv_h: 0.02
  hsv_s: 0.6
  hsv_v: 0.5
  degrees: 8.0
  translate: 0.15
  scale: 0.6
  shear: 4.0
  perspective: 0.0006
  flipud: 0.0
  fliplr: 0.3
  mosaic: 0.7
  close_mosaic: 15
  mixup: 0.05
  erasing: 0.3

# --- 3. экспорт ------------------------------------------------------------
export:
  # Имя менять не стали: под ним модель уже лежит в приложении. Классов в ней
  # теперь три — потребитель берёт нужный по индексу (0 — код).
  model_name: container_code_detector    # iOS: <имя>.mlpackage, Android: <имя>.tflite
  formats: [coreml, tflite]
  coreml_nms: false            # постобработку делает приложение
  tflite_int8: false
